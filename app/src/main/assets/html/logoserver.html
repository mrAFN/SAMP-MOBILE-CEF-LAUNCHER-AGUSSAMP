<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAXGUZ Stencil</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        background: transparent; 
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        
        /* DIUBAH KE 0.5vh AGAR SANGAT NEMPEL KE ATAS */
        padding-top: 0.5vh; 
        overflow: hidden;
    }

    .logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        transform: scale(0.8);
        opacity: 0;
    }

    /* SVG untuk menggambar teks dan memotongnya */
    .logo-svg {
        /* DIPERKECIL DARI 280px JADI 180px */
        width: 180px; 
        height: auto;
        /* Efek Bayangan 3D jatuh ke bawah */
        filter: drop-shadow(0px 5px 3px rgba(0,0,0,0.8));
    }

    /* Teks Dasar */
    .text-base {
        font-family: 'Impact', 'Arial Black', sans-serif;
        /* UKURAN TEKS IKUT DIPERKECIL */
        font-size: 65px; 
        font-weight: 900;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 2px;
        fill: #ffffff; /* Warna Putih */
        
        /* Outline Hitam Luar */
        stroke: #000000;
        stroke-width: 4px;
        stroke-linejoin: round;
        paint-order: stroke fill;
    }

    @keyframes popIn {
        to {
            opacity: 1;
            transform: scale(1);
        }
    }
</style>
</head>
<body>

    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <mask id="stencil-mask">
                    <rect x="0" y="0" width="300" height="100" fill="white" />
                    <line x1="20" y1="0" x2="40" y2="100" stroke="black" stroke-width="4" />
                    <line x1="50" y1="45" x2="130" y2="45" stroke="black" stroke-width="3" />
                    <line x1="150" y1="60" x2="280" y2="60" stroke="black" stroke-width="5" />
                    <line x1="180" y1="0" x2="160" y2="100" stroke="black" stroke-width="4" />
                    <rect x="100" y="20" width="8" height="20" fill="black" />
                    <rect x="220" y="30" width="5" height="25" fill="black" />
                </mask>
            </defs>

            <text x="50%" y="85%" text-anchor="middle" class="text-base" mask="url(#stencil-mask)">
                TAXGUZ
            </text>
        </svg>
    </div>

</body>
</html>
