<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ATY HUD - Water Level Glass</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: flex-start; 
            align-items: flex-end;
            height: 100vh;
            padding-left: 24px;
            padding-bottom: 24px;
        }

        /* =========================================
           CONTAINER UTAMA (LIQUID GLASS)
           ========================================= */
        .hbe-container {
            display: flex;
            flex-direction: row; 
            gap: 10px;
            /* Efek Kaca Transparan Khas iOS */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 6px 26px 0 rgba(0, 0, 0, 0.37);
        }

        /* =========================================
           KOTAK IKON (JADI WADAH AIR / GELAS)
           ========================================= */
        .stat-box {
            position: relative;
            width: 29px;
            height: 29px;
            border-radius: 8px;
            /* Background gelap transparan di dalam kotak */
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Wajib untuk CEF/Android agar air tidak bocor */
            transform: translateZ(0); 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* =========================================
           EFEK AIR BERGELOMBANG (LEVEL NAIK/TURUN)
           ========================================= */
        .water {
            position: absolute;
            left: -50%;
            width: 200%;
            height: 200%;
            bottom: -210%; /* Default Kosong (0%) */
            border-radius: 40%; /* Membuat ujung air membulat */
            transition: bottom 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            /* Animasi berputar untuk menciptakan efek ombak di permukaan */
            animation: waveAnimation 4s linear infinite; 
            z-index: 1;
        }

        /* Lapisan air kedua untuk efek ombak yang lebih realistis */
        .water-secondary {
            position: absolute;
            left: -55%;
            width: 210%;
            height: 210%;
            bottom: -210%;
            border-radius: 38%;
            transition: bottom 1s cubic-bezier(0.4, 0, 0.2, 1);
            animation: waveAnimation 6s linear infinite;
            opacity: 0.6;
            z-index: 2;
        }

        /* Animasi Ombak (Berputar perlahan) */
        @keyframes waveAnimation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Ikon di Atas Air */
        .icon {
            position: relative;
            z-index: 10; /* Pastikan ikon di atas air */
            font-size: 12px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* =========================================
           WARNA AIR (Vibrant Glow)
           ========================================= */
        .hp .water, .hp .water-secondary { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
        .armor .water, .armor .water-secondary { background: #8e8e93; box-shadow: 0 0 8px #8e8e93; }
        .hunger .water, .hunger .water-secondary { background: #ff9500; box-shadow: 0 0 8px #ff9500; }
        .thirst .water, .thirst .water-secondary { background: #007aff; box-shadow: 0 0 8px #007aff; }
        .bladder .water, .bladder .water-secondary { background: #34c759; box-shadow: 0 0 8px #34c759; }

        /* Teks persentase disembunyikan karena sudah visual air */
        .value-text {
            display: none; 
        }
    </style>
</head>
<body>

    <div class="hbe-container">
        <!-- Health -->
        <div class="stat-box hp">
            <div class="water" id="hp-w1"></div>
            <div class="water-secondary" id="hp-w2"></div>
            <i class="fa-solid fa-heart icon"></i>
        </div>

        <!-- Armor -->
        <div class="stat-box armor" id="armor-container">
            <div class="water" id="armor-w1"></div>
            <div class="water-secondary" id="armor-w2"></div>
            <i class="fa-solid fa-shield-halved icon"></i>
        </div>

        <!-- Hunger -->
        <div class="stat-box hunger">
            <div class="water" id="hunger-w1"></div>
            <div class="water-secondary" id="hunger-w2"></div>
            <i class="fa-solid fa-utensils icon"></i>
        </div>

        <!-- Thirst -->
        <div class="stat-box thirst">
            <div class="water" id="thirst-w1"></div>
            <div class="water-secondary" id="thirst-w2"></div>
            <i class="fa-solid fa-droplet icon"></i>
        </div>

        <!-- Bladder -->
        <div class="stat-box bladder">
            <div class="water" id="bladder-w1"></div>
            <div class="water-secondary" id="bladder-w2"></div>
            <i class="fa-solid fa-toilet icon"></i>
        </div>
    </div>

    <script>
        // =========================================
        // LOGIKA PENGATURAN TINGGI AIR
        // =========================================
        function updateLevel(idPrefix, percent) {
            const w1 = document.getElementById(idPrefix + '-w1');
            const w2 = document.getElementById(idPrefix + '-w2');
            
            if (!w1 || !w2) return;

            // Rumus Air Vertikal:
            // Kotak air tingginya 200%.
            // -210% = Air kosong total (di bawah kotak)
            // -90% = Air penuh total (menutupi seluruh kotak)
            // 100% level = -90% bottom
            const finalBottom = -210 + (percent * 1.2);

            w1.style.bottom = finalBottom + "%";
            w2.style.bottom = (finalBottom + 2) + "%"; // Sedikit offset untuk gelombang
        }

        // =========================================
        // FUNGSI UTAMA (Dipanggil dari Pawn)
        // =========================================
        function updateHBE(data) {
            console.log("Menerima data:", data); 
            const parts = data.split('|');
            if (parts.length < 5) return;

            const hp = Math.max(0, Math.min(100, parseFloat(parts[0]) || 0));
            const armor = Math.max(0, Math.min(100, parseFloat(parts[1]) || 0));
            const lapar = Math.max(0, Math.min(100, parseFloat(parts[2]) || 0));
            const haus = Math.max(0, Math.min(100, parseFloat(parts[3]) || 0));
            const kencing = Math.max(0, Math.min(100, parseFloat(parts[4]) || 0));

            // Update Ketinggian Air
            updateLevel('hp', hp);
            updateLevel('armor', armor);
            updateLevel('hunger', lapar);
            updateLevel('thirst', haus);
            updateLevel('bladder', kencing);

            // Sembunyikan Armor jika kosong (efek redup)
            const armorContainer = document.getElementById('armor-container');
            if (armorContainer) {
                if (armor <= 1) {
                    armorContainer.style.opacity = '0.4';
                } else {
                    armorContainer.style.opacity = '1';
                }
            }
        }

        function onCefEvent(event, data) {
            if (event === "updateHBE") {
                updateHBE(data);
            }
        }
    </script>
</body>
</html>
